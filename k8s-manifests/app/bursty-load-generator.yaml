apiVersion: v1
kind: Pod
metadata:
  name: bursty-load-generator
  namespace: default
spec:
  containers:
    - name: bursty-load
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Starting bursty load pattern (30s burst / 20s quiet, repeating)..."
          while true; do
            echo "$(date +%T) BURST START"
            start=$(date +%s)
            end=$((start+30))
            while [ "$(date +%s)" -lt "$end" ]; do
              for j in $(seq 1 30); do
                wget -q -O /dev/null http://metrics-app.default.svc.cluster.local/ &
              done
              wait
            done
            echo "$(date +%T) BURST END, quiet period..."
            sleep 20
          done
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"
  restartPolicy: Never
