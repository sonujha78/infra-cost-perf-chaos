apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: demo-app-pod-kill-schedule
  namespace: default
spec:
  schedule: "@every 15s"
  type: PodChaos
  historyLimit: 5
  concurrencyPolicy: Forbid
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces:
        - default
      labelSelectors:
        app: demo-app
