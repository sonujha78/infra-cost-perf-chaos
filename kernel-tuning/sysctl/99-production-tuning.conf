# Production Linux kernel tuning
# Applied and documented as part of infra-cost-perf-chaos task, Part C

# net.core.somaxconn — max connection backlog queue per listening socket.
# Default 4096 is decent, but bumped higher for high-throughput APIs that
# may see sudden connection bursts (e.g. behind an L4 load balancer).
# Demonstrated: with a small backlog (5), 44/50 rapid connections were
# refused; with a larger backlog (100), 0/50 were refused.
net.core.somaxconn = 65535

# net.ipv4.tcp_tw_reuse — allow reusing sockets in TIME_WAIT state for new
# outgoing connections. Default (2) only allows reuse for loopback traffic.
# Set to 1 (global) because high-throughput services making many short-lived
# outbound connections (e.g. calling other microservices) can otherwise
# exhaust the ephemeral port range while sockets sit in TIME_WAIT.
net.ipv4.tcp_tw_reuse = 1

# net.ipv4.ip_local_port_range — range of ephemeral ports available for
# outgoing connections. Default (32768-60999) gives ~28K ports. Widened to
# ~63K ports so a service making many concurrent outbound connections
# (service mesh sidecars, connection-per-request clients) doesn't exhaust
# available ports under load.
net.ipv4.ip_local_port_range = 2000 65000

# vm.swappiness — how aggressively the kernel swaps anonymous memory pages
# to disk under memory pressure. Default (60) is tuned for desktop-style
# workloads. For latency-sensitive DB/cache nodes, swapping is disastrous:
# disk I/O is ~1000x slower than RAM, causing severe latency spikes long
# before an actual OOM-kill would occur. We observed this directly in the
# cgroups demo: a cgroup-limited process avoided OOM-kill by swapping
# instead, because swap was enabled and not disabled at the cgroup level.
# Set low (not 0, to still allow emergency swap under extreme pressure)
# so the kernel strongly prefers reclaiming page cache over swapping
# application memory.
vm.swappiness = 10

# fs.inotify — controller-manager style processes (Chaos Mesh, kubectl,
# many k8s controllers) watch large numbers of files/directories via
# inotify. Low defaults cause "too many open files" / "failed to allocate
# directory watch" errors under this kind of load.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
